<style>
/* Sistema visual v0.2 (CDJ, 13/10/2026): papel, tinta, marcador; verde e vermelho só para acerto e erro. Coluna única de leitura, 560px, barra de seções no polegar. */
:root{
  --paper:#FBFBF8; --ink:#1B2A41; --ink-2:#4F5B6B; --rule:#D9DCE1; --soft:#F1F2EE;
  --marker:#F2C94C; --marker-soft:#FFF7D6; --c:#2E7D5B; --e:#9C2E2E; --on-strong:#FBFBF8; --focus:#1B6BB2;
  --fig:#FBFBF8;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14181E; --ink:#ECEEF1; --ink-2:#AEB5BF; --rule:#2F343C; --soft:#1E232A;
  --marker:#E2BB45; --marker-soft:#2E2A1A; --c:#5EBE92; --e:#E27A7A; --on-strong:#14181E; --focus:#7DB8F0; --fig:#FBFBF8; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#14181E; --ink:#ECEEF1; --ink-2:#AEB5BF; --rule:#2F343C; --soft:#1E232A;
  --marker:#E2BB45; --marker-soft:#2E2A1A; --c:#5EBE92; --e:#E27A7A; --on-strong:#14181E; --focus:#7DB8F0; --fig:#FBFBF8; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--focus)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:0 104px}
.wrap.semnav{padding-block-end:32px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.2;font-weight:700}
h2{font-size:21px;line-height:1.25;font-weight:700}
h3{font-size:17px;line-height:1.3;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.l{gap:20px}
.muted{color:var(--ink-2)}
.small{font-size:14px;line-height:1.4}
.xs{font-size:13px;line-height:1.4}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:14px;color:var(--ink-2)}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:20px 10px;border-bottom:2px solid var(--ink);margin-bottom:22px}
header.top b{font-size:17px}
header.top span{font-size:14px;color:var(--ink-2);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 18px;border:2px solid var(--ink);border-radius:8px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);background:var(--paper);text-align:center}
.btn.primary{background:var(--ink);color:var(--on-strong)}
.btn.big{min-height:64px;font-size:19px;justify-content:space-between}
.btn.big small{font-size:14px;font-weight:400;opacity:.9}
.btn[disabled]{border-color:var(--rule);color:var(--ink-2);background:var(--soft);cursor:default}
.btn.primary[disabled]{background:var(--rule);color:var(--ink-2)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}.row2>.w2{flex:2}
.link{color:var(--ink-2);text-decoration:underline;min-height:44px;display:inline-flex;align-items:center}
.card{border:1px solid var(--rule);border-radius:8px;padding:14px}
.card.on{border:2px solid var(--ink)}
.hl{background:var(--marker-soft);border-radius:8px;padding:12px 14px}
.box{border:2px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--ink-2)}
.box b{color:var(--ink)}
.vazio{border:1px dashed var(--rule);border-radius:8px;padding:16px;color:var(--ink-2);font-size:15px}
.spacer{flex:1}
.screen{min-height:calc(100dvh - 40px);display:flex;flex-direction:column}
/* barra de seções */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--rule);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-height:52px;font-size:14px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--marker)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:var(--on-strong);font-size:12px;line-height:18px}
/* folha de respostas */
.folha-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-block:18px 6px;font-size:15px;color:var(--ink-2)}
.cron{font-variant-numeric:tabular-nums}
.barras{display:flex;gap:3px;margin-top:4px}
.barras i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.barras i.r{background:var(--ink)}
.barras i.o{background:var(--paper);border:2px solid var(--ink)}
.barras i.ok{background:var(--c)}.barras i.er{background:var(--e)}
.comando{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:16px;line-height:1.45}
.comando.rep{color:var(--ink-2)}
.textobase{white-space:pre-wrap;font-size:16px;border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.enun{font-size:20px;line-height:1.45}
.fonte{font-size:14px;color:var(--ink-2)}
.ce{display:flex;align-items:center;gap:20px}
.bolha{width:80px;height:80px;border-radius:50%;border:3px solid var(--ink);font-size:32px;font-weight:700;display:grid;place-items:center;flex:none;transition:transform .12s}
.bolha:active{transform:scale(.96)}
.bolha[aria-pressed="true"]{background:var(--ink);color:var(--on-strong)}
.bolha.sm{width:64px;height:64px;font-size:26px}
.bolha.okk{border-color:var(--c);background:var(--c);color:var(--on-strong)}
.bolha.err{border-color:var(--e);background:var(--e);color:var(--on-strong)}
.ce .branco{margin-left:auto;color:var(--ink-2);text-decoration:underline;min-height:44px}
.ce .branco[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:none}
/* resultado */
.placar{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.placar .nota{font-size:56px;line-height:1;font-weight:700}
.placar .k{font-size:14px;color:var(--ink-2)}
.placar .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.t{width:100%;border-collapse:collapse;font-size:15px}
.t th,.t td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
.t th{font-size:13px;font-weight:400;color:var(--ink-2)}
.t td.r,.t th.r{text-align:right}
.pill{display:inline-block;min-width:56px;text-align:center;padding:2px 8px;border-radius:12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.v{background:var(--e);color:var(--on-strong)}
.pill.a{background:var(--marker);color:#1B2A41}
.pill.g{background:var(--c);color:var(--on-strong)}
.pill.n{color:var(--ink-2);font-weight:400}
.ok{color:var(--c);font-weight:700}.er{color:var(--e);font-weight:700}
.gab{display:inline-block;min-width:24px;text-align:center;border:2px solid currentColor;border-radius:4px;font-weight:700;padding:0 4px;font-size:14px}
details.corr{border-bottom:1px solid var(--rule);padding-block:10px}
details.corr summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;min-height:44px}
details.corr summary::-webkit-details-marker{display:none}
details.corr .just{font-size:15px;color:var(--ink-2);margin-top:6px}
/* estudo */
.blocos{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.bl{display:flex;align-items:center;gap:10px;min-height:28px;font-size:15px}
.bl .sq{width:14px;height:14px;border-radius:3px;border:2px solid var(--ink);flex:none;background:var(--paper)}
.bl .sq.half{background:linear-gradient(to right,var(--ink) 50%,var(--paper) 50%)}
.bl .sq.full{background:var(--ink)}
.bl .q{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.modhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px}
.lotecard{display:block;text-align:left;width:100%;color:inherit;text-decoration:none}
.lotecard .t1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lotecard .t1 b{font-size:17px}
.lotecard .t1{flex-wrap:wrap}
.lotecard .t1 b{flex:1 1 60%;min-width:0}
.lotecard .t1 span{font-size:13px;color:var(--ink-2);margin-left:auto;text-align:right}
/* achado 6: cabeçalho em uma linha no celular */
.topo-c{display:none}
@media (max-width:400px){ .topo-l{display:none} .topo-c{display:inline} header.top b{font-size:16px} header.top span.num{font-size:13px} }
/* Fase 2: onboarding multiconcursos (MapasPro) */
header.top.marca{align-items:flex-end}
header.top.marca b{font-size:21px;letter-spacing:-.01em}
header.top.marca b small{display:block;font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);margin-top:2px}
.eyebrow.up{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.concurso{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:8px;padding:14px;background:var(--paper);min-height:44px}
.concurso .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.concurso b{font-size:18px}
.concurso .seta{font-size:22px}
.comp{display:grid;grid-template-columns:1fr;gap:10px}
.comp .card h3{font-size:17px}
.comp .card p{margin-top:4px}
@media (min-width:600px){ .comp{grid-template-columns:1fr 1fr} }
.grupo h3{font-size:16px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.disc{padding-block:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.disc .nm{font-weight:700;line-height:1.3}
.par2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.duo{flex-direction:column;gap:0;min-height:56px;padding:6px 10px;font-size:15px;line-height:1.25}
.btn.duo small{font-weight:400;font-size:12.5px;opacity:.9}
.prep{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-block:9px;border-bottom:1px solid var(--rule);font-size:15px;color:var(--ink-2)}
.prep span:last-child{font-size:13px;white-space:nowrap}
/* achado 1: cobertura do edital */
.cob{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding-block:9px;border-bottom:1px solid var(--rule);font-size:15px}
.cob .st{font-size:13px;white-space:nowrap}
.cob.falta .nm{color:var(--ink-2)}
/* leitura */
.curso{font-size:17px;line-height:1.55}
.curso h3{margin-top:22px;font-size:17px}
.curso p{margin-top:12px}
.curso ul,.curso ol{margin:10px 0 0;padding-left:22px}
.curso li{margin-top:6px}
.curso .def{background:var(--marker-soft);border-radius:8px;padding:12px 14px;margin-top:14px}
.curso .peg{border:2px solid var(--rule);border-radius:8px;padding:10px 12px;margin-top:14px;color:var(--ink-2);font-size:16px}
.curso .peg b{color:var(--ink)}
figure.fig{margin:16px 0 0;background:var(--fig);border-radius:8px;padding:10px}
figure.fig figcaption{font-size:13px;color:#4F5B6B;margin-top:4px}
.par{border-bottom:1px solid var(--rule);padding-block:12px}
.par .ab{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-weight:700}
.par .ab span{font-weight:400;color:var(--ink-2)}
.par ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
/* painel */
.ped{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--rule)}
.ped .id{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ped .tx{font-size:14px;line-height:1.35;min-width:0}
.ped .bar{grid-column:2/3;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.ped .bar i{display:block;height:100%;background:var(--ink)}
.ped.sub .id{font-weight:400;color:var(--ink-2)}
.leg{font-size:13px;color:var(--ink-2);line-height:1.45}
/* discursiva */
.folhad{display:block;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.folhad .nums{background:var(--soft);font-size:12px;color:var(--ink-2);text-align:right;padding:8px 6px 8px 0;line-height:28px;font-variant-numeric:tabular-nums;overflow:hidden}
.folhad textarea{border:0;resize:none;padding:8px 10px;line-height:28px;font-size:16px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);background-position:0 0;background-attachment:local;color:var(--ink);min-height:560px;width:100%;outline-offset:-3px}
.folhad textarea{background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-origin:content-box;background-attachment:local}
.contador{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding-block:8px;display:flex;justify-content:space-between;align-items:baseline;z-index:2;border-bottom:1px solid var(--rule)}
.contador b{font-size:20px}
.contador .exc{color:var(--e);font-weight:700}
.asp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--rule);font-size:15px}
.asp select{border:2px solid var(--ink);border-radius:6px;background:var(--paper);min-height:44px;padding:0 8px}
.pre{white-space:pre-wrap;font-size:15px;line-height:1.5}
/* véspera */
.chk{display:flex;gap:14px;align-items:flex-start;min-height:52px;padding-block:10px;border-bottom:1px solid var(--rule);cursor:pointer}
.chk input{width:28px;height:28px;margin:0;flex:none;accent-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink)}
textarea.json{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);padding:10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-strong);padding:10px 16px;border-radius:8px;font-size:15px;z-index:9;max-width:90vw}
.carregando{padding:60px 0;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:600px){ body{font-size:18px} }
</style>
<style>
/* ===== v15: quatro abas, painel por matéria e tópico, leitura do curso ===== */
.abas-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.abas-li{display:flex;gap:14px;align-items:flex-start}

.materia{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;min-height:44px}
.materia .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.materia b{font-size:16px;line-height:1.3}
.materia .seta{font-size:20px;color:var(--ink-2)}
.prog{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:4px}

.gtit{font-size:16px;margin-top:22px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.gtit .num{margin-right:4px}
.topico{padding-block:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.topico .tt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;line-height:1.35}
.topico .tt b{font-size:15px}
.topico .ts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-left:52px;align-items:center}
.topico .par2{padding-left:52px}
@media (max-width:400px){ .topico .ts,.topico .par2{padding-left:0} }
.rec h3{font-size:18px}
details.grp{border-bottom:1px solid var(--rule)}
details.grp summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-height:44px;padding-block:10px;font-size:15px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";font-weight:700;color:var(--ink-2);margin-left:6px}
details.grp[open] summary::after{content:"−"}
/* leitura */
.leitura .curso{font-size:17.5px;line-height:1.68;max-width:62ch}
.leitura h1{font-size:28px;line-height:1.18}
.sec{margin-top:26px}
h2.sech{font-size:20px;padding-top:14px;border-top:1px solid var(--rule)}
.curso h3{margin-top:24px;font-size:17px}
.curso h4{margin:18px 0 0;font-size:16px}
.curso p{margin-top:12px}
.bx{border-radius:10px;padding:12px 14px 14px;margin-top:18px}
.bx>:first-child{margin-top:0}
.bx p{margin-top:8px}
.bx ul,.bx ol{margin-top:8px}
.bxl{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0!important}
.bxs{font-weight:700;margin-top:4px!important}
.bx.def{background:var(--marker-soft)}
.bx.ex{background:var(--soft);border-left:4px solid var(--ink-2)}
.bx.peg{border:2px solid var(--marker);background:var(--paper)}
.bx.peg .bxl{color:var(--ink)}
.em1{background:var(--marker-soft);border-radius:10px;padding:12px 14px;margin-top:18px}
.em1 ul{margin:6px 0 0;padding-left:20px}
.em1 li{margin-top:6px}
.tabwrap{overflow-x:auto;margin-top:14px;max-width:100%;-webkit-overflow-scrolling:touch}
.tabwrap:focus-visible{outline:3px solid var(--focus)}
table.tc{font-size:14.5px;line-height:1.4;min-width:420px}
table.tc th{font-weight:700;color:var(--ink);background:var(--soft);font-size:13.5px}
table.tc td,table.tc th{padding:8px 8px;vertical-align:top}
pre.quadro{margin:0;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--soft);border-radius:8px;padding:10px;white-space:pre;width:max-content;min-width:100%}
figure.vis{margin:18px 0 0}
.vt{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.fluxo ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 0;counter-reset:passo}
.fluxo li{counter-increment:passo;display:flex;align-items:center;font-size:14.5px;line-height:1.3}
.fluxo li::before{content:counter(passo);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-strong);font-size:12px;font-weight:700;display:grid;place-items:center;margin-right:6px}
.fluxo li{border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;background:var(--paper)}
.fluxo li+li{margin-left:22px;position:relative}
.fluxo li+li::after{content:"→";position:absolute;left:-18px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:700}
@media (max-width:480px){ .fluxo ol{flex-direction:column;gap:18px} .fluxo li+li{margin-left:0} .fluxo li+li::after{content:"↓";left:18px;top:-17px;transform:none} }
.linha{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--ink)}
.linha li{margin-top:10px;position:relative}

function limpaTop(s,tid){ return ehDA(tid)?limpaProd(String(s??"")):limpaRef(s); }
/* v15.1: marcas internas de produção (código de fonte F1…F22, QA, versão do texto, códigos de item e de par, tipo de pegadinha)
   saem só na exibição; o pacote não muda. Linhas de quadro (com |) recebem espaços no lugar, para não desalinhar colunas.
   A limpeza definitiva no texto é da Fábrica (encomenda c, 18/10/2026). */
const RE_COD="(?:A5|BQ|L\\d[A-Z]?|6[AB]|4C|5C)-[QR]?\\d+";
function limpaProd(s){
  let t=String(s??"").replace(/^(TC|IC|GI|AT)(?: [a-zà-ú]+)? \(([^()]*(?:\([^()]*\))?[^()]*)\)\.\s*/,(m,c,x)=>"Armadilha do item: "+x.replace(/^tentação:\s*/,"")+". ");
  t=t.replace(/\([FN]\d+[:;,][^()\n]*\n[^()]*\)/g,m=>m.replace(/\s*\n\s*/g," "));
  t=t.replace(/[ \t]*\[(?:V \d|NORMATIVO)[^\]]*\n[^\]]*\]/g,m=>trocaTags(m.replace(/\s*\n\s*/g," "),false));
  return t.split("\n").map(l=>trocaTags(l,(l.match(/\|/g)||[]).length>=2)).join("\n");
}
function limpaExtra(x){ return x.replace(/\b[FN]\d+\b,?\s*/g,"").replace(/\bv\d+\b,?\s*/g,"").replace(/NORMATIVO\s*[—-]\s*QA:?\s*/g,"").replace(/\bD-[A-Z0-9-]+;?\s*/g,"").replace(/REVERIFICAR\s*\(normativo\)\s*/i,"reverificar em ").trim().replace(/^[,;:\s]+|[,;\s]+$/g,""); }
function trocaTags(l,tab){
  const R=(re,fn)=>{ l=l.replace(re,(...a)=>{ const m=a[0]; const lead=a[1]||""; let r=fn(...a); r=r?lead+r:""; if(tab&&r.length<m.length) r+=" ".repeat(m.length-r.length); return r; }); };
  R(/([ \t]*)\[V (\d{1,2}\/\d{1,2}\/\d{4})(?:\s*[—-]\s*([^\]]*))?\]/g,(m,lead,d,resto)=>{
    const ex=String(resto||"").split(/;\s*/).map(limpaExtra).filter(x=>x&&!/^(trecho indexado|menu de recursos)$/i.test(x));
    return `(verificado em ${d}${ex.length?"; "+ex.join("; "):""})`; });
  R(/([ \t]*)\[NORMATIVO\s*[—-]\s*QA(?::\s*([^\]]+?)|;\s*([^\]]+))?\]/g,(m,lead,base,ex)=>{ if(base) return `(${base.replace(/\.$/,"")})`; const e=ex?ex.split(/;\s*/).map(limpaExtra).filter(Boolean):[]; return e.length?`(${e.join("; ")})`:""; });
  R(/([ \t]*)\[F\d+(?:,\s*F\d+)*\]/g,()=>"");
  R(/([ \t]*)\(([FN]\d+(?:\s*(?:,|e)\s*[FN]\d+)*)(?:([,;:])\s*([^()]*))?\)/g,(m,lead,c,sep,resto)=>{ resto=String(resto||"").replace(/\bseção [\d.]+,?\s*/g,"").trim(); return resto?`(${resto})`:""; });
  R(/()\bFonte: F\d+(?:,\s*F\d+)*(,\s*)?/g,(m,lead,v)=>v?"Fonte oficial, ":"Fonte oficial");
  R(/([ \t]*)\((?:v\d+|errata E\d+)\b[^()]*\)/g,()=>"");
  R(new RegExp("()\\s*Difere\\s+d[oa]s?\\s+ite(?:m|ns)\\s+"+RE_COD+"(?:[^.]|\\.\\d)*\\.","g"),()=>"");
  R(new RegExp("()\\s*\\((?:ver|compatível com)\\s+"+RE_COD+"[^()]*\\)","g"),()=>"");
  R(/([ \t]*)\(par(?:es)? C\d+[^()]*\)/g,()=>""); R(/()\s+e d[oa]s? par(?:es)? C\d+(?:\s*e\s*C\d+)*/g,()=>""); R(/();\s*par(?:es)? C\d+/g,()=>"");
  R(/()\s*Só o fato e a fonte\./g,()=>"");
  return l;
}

/* ---------- estrutura por tópico ---------- */
function construir(){
  const ed=P.edital||[]; const ids=new Set(ed.map(e=>e.id));
  const pai=id=>{ let c=sobe(id); while(c && !ids.has(c)) c=sobe(c); return c; };
  const nItens={}; P.itens.forEach(i=>{ nItens[i.itemEdital]=(nItens[i.itemEdital]||0)+1; });
  const secoes={}, pegs={}, resumos={};
  const add=(tid,s)=>{ (secoes[tid]=secoes[tid]||[]).push(s); };
  (P.lotes||[]).forEach(l=>{
    /* v16: prefixo dos ids do lote = itensEdital[0] sem o último "-<número>" ("P1-DA-1" → "P1-DA"; "P2-1.1" → "P2"); sem isso, a prova. */
    const pm=String((l.itensEdital||[])[0]||"").match(/^(.+)-\d+(?:\.\d+)*$/); const pref=pm?pm[1]:l.prova;
    const curso=String(l.curso||"").replace(/\r/g,"").trim();
    if(curso){ const partes=curso.split(/\n(?=## )/).map(p=>p.trim()).filter(Boolean); let atual=null;
      partes.forEach((p,k)=>{ const m=p.match(/^## (.+)\n?/); let tid=null, titulo="", corpo=p, vol=false;
        if(m){ corpo=p.slice(m[0].length); const h=m[1]; vol=/VOL[ÁA]TIL/i.test(h);
          const num=(h.match(/^(?:ITEM\s+)?(\d+(?:\.\d+)*)/i)||[])[1];
          if(num){ let c=pref+"-"+num; while(c && !ids.has(c)) c=sobe(c); tid=c; }
          titulo=limpaTitulo(h.replace(/\s*[—-]\s*VOL[ÁA]TIL\s*$/i,"")).replace(/^\d+(\.\d+)*\s+/,"").replace(/\s*[—-]\s*vis[aã]o geral$/i,"").trim();
        }
        if(!tid && !m) tid=maisCitado(l,p);
        if(!tid) tid=atual||(l.itensEdital||[])[0];
        if(!tid) return; atual=tid;
        add(tid,{chave:l.id+":"+k,lote:l.id,k,titulo,corpo,vol,compl:!m});
      });
    }
    (l.pegadinhas||[]).forEach(p=>{ if(p.itemEdital) (pegs[p.itemEdital]=pegs[p.itemEdital]||[]).push(p); });
    if(String(l.resumo||"").trim()) (l.itensEdital||[]).forEach(t=>{ (resumos[t]=resumos[t]||[]).push(l.id); });
  });
  /* v17 DA-v2: ids citados em linhas `ITEM <id>` do curso de cada tópico não contam como questões de verificação (ESPEC §4) */
  const inl={}; Object.entries(secoes).forEach(([tid,ss])=>{ const s=new Set(); ss.forEach(x=>String(x.corpo||"").split("\n").forEach(l=>{ const m=l.trim().match(/^ITEM\s+([A-Za-z0-9][\w.-]*)$/); if(m&&Object.hasOwn(M,m[1])&&M[m[1]].itemEdital===tid) s.add(m[1]); })); inl[tid]=s; });
  const extra=Object.assign({},TOPICOS_DEMO,P.topicos||{});
  const top={}, porDisc={}, ordem=[];
  ed.forEach(e=>{ const d=discDoEdital(e.id); if(!d) return;
    const filhos=ed.filter(x=>pai(x.id)===e.id).map(x=>x.id);
    const o={id:e.id,num:curtoId(e.id),nome:e.texto,disc:d.id,prova:e.prova||modOf(e.id),pai:pai(e.id),filhos,
      n:Math.max(0,(nItens[e.id]||0)-((inl[e.id]||new Set()).size)),nInline:(inl[e.id]||new Set()).size,secoes:secoes[e.id]||[],pegs:pegs[e.id]||[],resumoLotes:resumos[e.id]||[],extra:extra[e.id]||null};
    o.temCurso=o.secoes.length>0; o.topico=o.n>0||o.temCurso; o.grupo=filhos.length>0;
    top[e.id]=o; (porDisc[d.id]=porDisc[d.id]||[]); if(o.topico){ porDisc[d.id].push(e.id); ordem.push(e.id); }
  });
  T={top,porDisc,ordem,ed};
}
function maisCitado(l,txt){ let best=null,bn=0; (l.itensEdital||[]).forEach(t=>{ const n=(txt.match(new RegExp("\\b"+curtoId(t).replace(/\./g,"\\.")+"\\b","g"))||[]).length; if(n>bn){bn=n;best=t;} }); return best; }
function topicosDe(discId){ return (T.porDisc[discId]||[]).map(id=>T.top[id]); }
function tp(id){ return T.top[id]; }

function garantirV15(){
  S.resp=Array.isArray(S.resp)?S.resp:[]; S.top=S.top||{};
  if(S.v15) return;
  const out=[];
  (S.tentativas||[]).forEach(t=>{ const o=t.tipo==="sim"?(/^D30-/.test(t.ref||"")?"diag":"sim"):(t.tipo||"sim");
    (t.det||[]).forEach(d=>{ const it=M[d.id]; if(!it) return; out.push({id:d.id,tp:it.itemEdital,st:d.st,t:t.data,o,mig:1}); }); });
  (S.eventos||[]).filter(e=>e.e==="caderno_item_respondido").forEach(e=>{ const it=M[e.id]; if(!it) return; out.push({id:e.id,tp:it.itemEdital,st:e.ok?"c":"e",t:e.t,o:"cad",mig:1}); });
  out.sort((a,b)=>a.t-b.t); S.resp=out.concat(S.resp);
  Object.entries(S.lote||{}).forEach(([lid,L])=>{ (L.vistos||[]).forEach(k=>{ const chave=lid+":"+k;
    Object.values(T.top).forEach(o=>{ if(o.secoes.some(s=>s.chave===chave)){ const st=estTop(o.id); if(!st.vis.includes(chave)) st.vis.push(chave); } }); }); });
  Object.values(T.top).forEach(o=>{ const st=S.top[o.id]; if(st && o.secoes.length && o.secoes.every(s=>st.vis.includes(s.chave))) st.lido=true; });
  S.v15={migradoEm:Date.now(),respostasConvertidas:out.length};
  ev("migracao_v15",{respostas:out.length}); salvar();
}

/* ---------- nota por tópico (janela móvel) ---------- */
function janela(tid){ let rs=S.resp.filter(r=>r.tp===tid);
  if(!CONTA_REPETIDAS){ const v=new Set(); rs=rs.slice().reverse().filter(r=>!v.has(r.id)&&v.add(r.id)).reverse(); }
  return rs.slice(-JANELA); }
function notaTopico(tid){ const w=janela(tid); const n=w.length, c=w.filter(r=>r.st==="c").length, e=w.filter(r=>r.st==="e").length;
  const k=divTopico(tid); return {n,c,e,b:n-c-e,k,completa:n>=k,nota:n>=k?c-e:null,rep:CONTA_REPETIDAS&&new Set(w.map(r=>r.id)).size<n}; } // v17.2: nota completa com k = divTopico
function sinal(n){ return n>0?"+"+n:n<0?"−"+Math.abs(n):"0"; }
function statusNota(tid){ const nt=notaTopico(tid); return nt.completa?"nota completa":`${nt.n} de ${nt.k} questões`; } // v17.2 (D-V17-2-JANELA-20): conta as vistas, inclusive em branco (valem 0), como a janela
function notaHtmlTop(tid){ return `<b class="num">${pctTxt(pctTopico(tp(tid)))}</b> <span class="xs muted num" data-status-nota="${esc(tid)}">(${statusNota(tid)})</span>`; } // v17: desempenho em %; v17.2: + status

/* Pesos (D-V17-DESIGN, ponto b). Entre P1 e P2: o edital Câmara 2026 (Cebraspe) dá peso igual — cada prova objetiva tem 90 itens (7.1), vale +1/−1/0 por item (8.11.2)

   discursiva P3 (NFPD), fora do escopo desta nota. Entre matérias de uma prova e entre tópicos de uma matéria o edital NÃO fixa pesos: vale o critério vigente da
   plataforma (pesoDisc/pesoTop: 90 itens divididos igualmente entre as matérias; tópicos iguais dentro da matéria) — PROVISÓRIO, ver PESO_FONTE. */
const PESO_PROVA={P1:1,P2:1};
const VESPERA_DATA="16/01/2027"; // véspera da prova de 17/1/2027 (D-V17-DESIGN, ponto a)
const UI={mat:new Set(),top:new Set()}; // matérias e tópicos abertos nesta visita
let _divP=null,_divM=null;
function divTopico(id){ if(_divP!==P){ _divP=P; _divM={}; const v={}, ic={}; const inl=t=>ic[t]||(ic[t]=(T&&T.top&&T.top[t]&&T.top[t].nInline)?idsInline(t):new Set()); P.itens.forEach(i=>{ const t=i.itemEdital; if(inl(t).has(i.id)) return; (v[t]=v[t]||new Set()).add(i.id); }); Object.keys(v).forEach(t=>_divM[t]=v[t].size); } // v17.1: intercalados fora do divisor (ESPEC §4; QA R4 N1)

/* Sequência “A → B → C” (3 a 7 etapas curtas) no texto do curso vira um fluxo visual logo abaixo do parágrafo. O texto não muda. */
function fluxoDe(txt){
  const segs=String(txt).split(/(?<=[.;])\s+/); let h="";
  segs.forEach(sg=>{ if((sg.match(/→/g)||[]).length<2) return;
    let nos=sg.split("→").map(x=>x.trim()); nos[0]=nos[0].split(/:\s+/).pop(); nos[nos.length-1]=nos[nos.length-1].replace(/[.;]$/,"");
    if(nos.length<3||nos.length>7||nos.some(n=>!n||n.length>48||/[.]\s/.test(n))) return;
    h+=visual({tipo:"fluxo",passos:nos,auto:true}); });
  return h;
}

  const errs=its.filter(i=>ult[i.id] && (S.erros[i.id]||ult[i.id].st!=="c")).sort((a,b)=>ult[a.id].t-ult[b.id].t);

function paraResumo(t){ return String(t||"").replace(/\r/g,"").split("\n").map((l,k)=>{ const s=l.trim(); let m;

    return (k?"\n":"")+"**"+m[1]+(ini?" "+ini:"")+"**"+m[2].slice(ini.length); }
  if((m=s.match(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9\- \/()]{3,}?:)(\s.*)$/))) return (k?"\n":"")+"**"+m[1]+"**"+m[2];
  return l; }).join("\n"); }

/* ---------- 4 · Recomendações ---------- */
function pesoDisc(d){ return 90/DISCIPLINAS.filter(x=>x.prova===d.prova).length; }
function pesoTop(o){ return pesoDisc(discById(o.disc))/Math.max(1,topicosDe(o.disc).length); }
function lacuna(o){ const nt=notaTopico(o.id); if(!nt.n) return 1; const obs=(1-(nt.c-nt.e)/nt.n)/2; const k=5; return (nt.n*obs+k)/(nt.n+k); }
function prioridade(o){ return pesoTop(o)*lacuna(o); }
function porque(o){ const nt=notaTopico(o.id); const d=discById(o.disc); const st=S.top[o.id];
  const a=[`${d.prova}, ${curtoDisc(d)}: cada tópico vale cerca de ${fmt(pesoTop(o))} item da prova, numa estimativa provisória`];
  if(!nt.n) a.push(st&&st.lido?"você leu o curso, mas ainda não respondeu questões":"você ainda não estudou este tópico");
  else if(nt.nota!==null) a.push(`nota recente ${sinal(nt.nota)}/${nt.k}`); // v17.2: divisor do tópico
  else a.push(`${nt.n} respostas até agora, com saldo ${sinal(nt.c-nt.e)}`);
  return a.join(" · "); }
function acaoTop(o){ const st=S.top[o.id]; if(o.temCurso && !(st&&st.lido)) return {txt:o.n?"Ler o curso e resolver as questões":"Ler o curso",go:()=>ir("curso",o.id)}; return {txt:`Resolver ${Math.min(BLOCO,o.n)} questões`,go:()=>iniciarBloco(o.id)}; }
function recomendacoes(){
  const cand=T.ordem.map(tp).filter(o=>o.temCurso||o.n).map(o=>({o,p:prioridade(o)})).sort((a,b)=>b.p-a.p||T.ordem.indexOf(a.o.id)-T.ordem.indexOf(b.o.id));
  const out=[]; if(!cand.length) return out;
  const A=cand[0]; out.push({op:"A",rot:"Maior retorno esperado",o:A.o,por:porque(A.o),acao:acaoTop(A.o)});
  const B=cand.find(c=>c.o.disc!==A.o.disc)||cand.find(c=>c.o!==A.o && (c.o.pai||c.o.id)!==(A.o.pai||A.o.id));
  if(B) out.push({op:"B",rot:B.o.disc!==A.o.disc?"Outra matéria":"Outro grupo de tópicos",o:B.o,por:porque(B.o),acao:acaoTop(B.o)});
  const nErr=Object.keys(S.erros).filter(id=>M[id]).length;
  if(nErr) out.push({op:"C",rot:"Atividade curta",titulo:"Revisar o caderno de erros",por:`${nErr===1?"1 item errado espera":nErr+" itens errados esperam"} revisão; cada um sai depois de dois acertos seguidos`,acao:{txt:`Revisar ${pl(Math.min(BLOCO,nErr),"item","itens")} · cerca de ${minutos(Math.min(BLOCO,nErr))} min`,go:()=>{ const ids=Object.keys(S.erros).filter(id=>M[id]).sort((a,b)=>S.erros[b].errou-S.erros[a].errou).slice(0,BLOCO); iniciarRevisao(ids); }}});
  else { const C=cand.find(c=>c.o!==A.o && (!B||c.o!==B.o) && c.o.pegs.length && c.o.temCurso);
    if(C) out.push({op:"C",rot:"Atividade curta",o:C.o,titulo:`Pegadinhas de ${C.o.num} ${C.o.nome}`,por:`${C.o.pegs.length} pegadinha(s) prováveis no fim do curso · ${porque(C.o)}`,acao:{txt:"Ler as pegadinhas do tópico",go:()=>{ ir("curso",C.o.id); setTimeout(()=>{ const l=document.getElementById("pegsLista"); if(l) l.open=true; const h=document.getElementById("pegsFim"); if(h) h.scrollIntoView({block:"start"}); },50); }}}); }
  /* v17 DA-v2 (QA R3 D5): opção D quando a candidata errou 3+ itens DIFERENTES de um mesmo mecanismo numa matéria; conta itens, não respostas */
  { const melhor=DISCIPLINAS.map(d=>{ const r=errosPorMecanismo(d.id); const ks=Object.keys(r.itens||{}); const k=ks.sort((x,y)=>r.itens[y].size-r.itens[x].size)[0]; return k?{d,k,e:r.itens[k].size}:null; }).filter(Boolean).sort((a,b)=>b.e-a.e)[0];
    if(melhor&&melhor.e>=3){ const disp=P.itens.filter(i=>topicosDe(melhor.d.id).some(o=>o.id===i.itemEdital)&&i.mecanismo===melhor.k&&!i.volatil&&!ehInline(i)).length;
      out.push({op:"D",rot:"Treino por mecanismo",titulo:`Treinar ${melhor.k}: ${MECANISMOS[melhor.k]}`,por:`você errou ${melhor.e} itens diferentes construídos assim em ${curtoDisc(melhor.d)}; ${melhor.k==="LIT"?"conferir a paráfrase palavra a palavra":"reconhecer a troca"} é o que decide o item`,acao:{txt:`Treinar ${melhor.k} · ${pl(Math.min(BLOCO,disp),"item","itens")}`,go:()=>iniciarTreinoMecanismo(melhor.d.id,melhor.k)}}); } }
  return out;
}
function pratica(){
  const p2=T.ordem.map(tp).filter(o=>o.prova==="P2"&&o.temCurso); const lidos=p2.filter(o=>S.top[o.id]&&S.top[o.id].lido).length;
  const disc=(P.discursivas||[]).filter(d=>!(S.disc[d.id]&&S.disc[d.id].entregue));
  const escolha=[disc.find(d=>d.tipo!=="peca"),disc.find(d=>d.tipo==="peca")].filter(Boolean);
  const okDisc=p2.length && lidos/p2.length>=LIM_DISC && escolha.length;
  const finais=listaSimulados().filter(s=>!/^D30-/.test(s.id)&&!/diagn/i.test(s.tipo||""));
  const modSim=new Set(finais.flatMap(s=>s.itens.map(id=>M[id]?modOf(M[id].itemEdital):null))); // v16: DA não entra no gatilho enquanto não houver simulado com DA
  const comQ=T.ordem.map(tp).filter(o=>o.n && modSim.has(modOf(o.id))); const prat=comQ.filter(o=>notaTopico(o.id).n).length;
  const ultSim=Math.max(0,...S.tentativas.filter(t=>t.tipo==="sim"&&finais.some(s=>s.id===t.ref)).map(t=>t.data));
  const sim=finais.map(s=>({s,u:Math.max(0,...S.tentativas.filter(t=>t.ref===s.id).map(t=>t.data))})).sort((a,b)=>a.u-b.u)[0];
  const okSim=comQ.length && prat/comQ.length>=LIM_SIM && (Date.now()-ultSim)>DIAS_SIM*86400000 && sim;
  return {okDisc,escolha,lidos,p2:p2.length,okSim,sim:sim&&sim.s,prat,comQ:comQ.length};
}

  const ultima=s=>{ const f=S.tentativas.filter(t=>t.ref===s.id); return f[f.length-1]; };
  const ni=n=>n<0?"−"+Math.abs(n):String(n); // sinal "−" tipográfico
  const linha=(s,ant)=>{ const ult=ultima(s);
    return `<button class="card lotecard" data-sim="${esc(s.id)}"><div class="t1"><b>${esc(limpaNome(s.nome))}</b>${ant&&ult?`<span class="nt">nota <b class="num">${ni(ult.nota)}</b>/${ult.total}</span>`:`<span class="num">${s.itens.length} itens</span>`}</div>
    ${s.aviso?`<div class="xs muted" style="margin-top:6px">${esc(s.aviso)}</div>`:""}</button>`; };
  const diag=/diagn/i, ehD30=s=>/^D30-/.test(s.id);
  const fin=sims.filter(s=>!ehD30(s)&&!diag.test(s.tipo||"")&&!ultima(s));
  const ant=sims.filter(s=>ultima(s)&&!ehD30(s)&&!diag.test(s.tipo||"")); // v17 R2: só o que foi feito, com a nota ao lado (final já feito inclusive); pedido do Fundador (23/10/2026): diagnósticos não aparecem aqui (continuam na escolha de caminho e na matéria)
  const bloco=(tit,arr,ehAnt)=>arr.length?`<div class="stack"><h2>${tit}</h2>${arr.map(s=>linha(s,ehAnt)).join("")}</div>`:"";
  app().innerHTML=`${topo()}<div class="stack l">
   <p><button class="link" id="volta">← Painel</button></p>
   <div><h1>Simulados</h1><p class="small muted" style="margin-top:6px">Itens no formato da prova: marque C ou E. Certo +1, errado −1, em branco 0 (edital 8.11.2).</p></div>
   ${bloco("Simulados finais",fin,false)}${bloco("Simulados anteriores",ant,true)}${fin.length||ant.length?"":`<div class="vazio">Nenhum simulado disponível ainda.</div>`}
  </div>`;
  $("#volta").onclick=()=>ir("painel");
  app().querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>iniciar(b.dataset.sim));
}
function vDiscursivas(){
  const ds=P.discursivas||[]; const feita=d=>!!(S.disc[d.id]&&S.disc[d.id].entregue);
  const card=(d,ant)=>{ const st=S.disc[d.id]; const lin=d.tipo==="peca"?50:20; const num=String(d.id).replace(/\D/g,"");
    return `<button class="card lotecard" data-disc="${esc(d.id)}"><div class="t1"><b>${d.tipo==="peca"?"Peça técnica":"Questão discursiva"} ${esc(num)}</b>${ant?(Object.keys(st.notas||{}).length?`<span class="nt">nota estimada <b class="num">${fmt(st.nota||0)}</b></span>`:`<span class="nt">a corrigir</span>`):`<span>${lin} linhas</span>`}</div>
    <div class="small muted" style="margin-top:4px">${esc(primeiraFrase(d.comando))}</div>${!ant&&st&&st.texto?`<div class="xs" style="margin-top:6px">Rascunho guardado</div>`:""}</button>`; };
  const pend=ds.filter(d=>!feita(d)), ant=ds.filter(feita);
  app().innerHTML=`${topo()}<div class="stack l">
   <p><button class="link" id="volta">← Painel</button></p>
   <div><h1>Discursivas</h1><p class="small muted" style="margin-top:6px">Folha com linhas numeradas e a fórmula de desconto do edital (9.8.5).</p></div>
   ${pend.length?`<div class="stack">${pend.map(d=>card(d,false)).join("")}</div>`:`<div class="vazio">${ds.length?"Todas as discursivas disponíveis já foram entregues.":"Nenhuma discursiva disponível ainda."}</div>`}
   ${ant.length?`<div class="stack"><h2>Discursivas anteriores</h2>${ant.map(d=>card(d,true)).join("")}</div>`:""}
  </div>`;
  $("#volta").onclick=()=>ir("painel");
  app().querySelectorAll("[data-disc]").forEach(b=>b.onclick=()=>ir("disc",b.dataset.disc));
}

/* ---------- Pacote e dados ---------- */
function vDados(){
  const msgDados=vDados.msg||""; vDados.msg="";
  const custom=!!lsGet(K_P);
  const evs={}; S.eventos.forEach(e=>evs[e.e]=(evs[e.e]||0)+1);
  app().innerHTML=`${topo()}<div class="stack l">
   <p><button class="link" id="volta">← Painel</button></p>
   <div><h1>Conteúdo e dados</h1><p class="small muted" style="margin-top:6px">O progresso fica só neste aparelho.</p></div>
   <div class="card stack"><b>Conteúdo em uso</b><p class="small">Atualizado em ${esc(P.geradoEm||"?")} · ${P.itens.length} questões (${P.itens.filter(i=>i.rotulo==="AUTORAL").length} inéditas, ${P.itens.filter(i=>i.rotulo!=="AUTORAL").length} da Cebraspe) · ${T.ordem.length} tópicos · ${P.simulados.length} simulados · ${(P.discursivas||[]).length} discursivas${custom?" · carregado neste aparelho":""}</p></div>
   <div class="stack"><h2>Exportar meus erros</h2><p class="small muted">Gera um arquivo com seu caderno de erros, suas provas e suas discursivas entregues, para a correção da semana. Nada muda no seu progresso.</p>${btnExportar()}</div>
   <details class="card"><summary style="cursor:pointer;min-height:32px"><b>Dados técnicos</b></summary><div class="stack" style="margin-top:10px">
   <p class="xs muted">Plataforma ${VERSAO_APP} · ${esc(P.nome||"pacote")} · versão ${esc(P.versao)} · respostas registradas: ${S.resp.length}</p>
   <div class="stack"><label for="js"><b>Carregar outro pacote.json</b></label><textarea class="json" id="js" placeholder='{"versao":1,"itens":[…],"simulados":[…]}'></textarea>
   <div class="row2"><button class="btn primary" id="car">Carregar</button>${custom?`<button class="btn" id="pub">Voltar ao publicado</button>`:""}</div><p class="small muted" id="msg" role="status">${esc(msgDados)}</p></div>
   <div><h3>Métricas da jornada</h3><table class="t" style="margin-top:6px"><tr><th>Evento</th><th class="r">Vezes</th></tr>${Object.entries(evs).map(([k,v])=>`<tr><td class="xs">${esc(k)}</td><td class="r num">${v}</td></tr>`).join("")||`<tr><td colspan="2" class="muted">Nenhum evento ainda.</td></tr>`}</table></div>
   <div class="stack" id="zona"><button class="btn" id="apag">Apagar meu progresso</button></div></div></details>
  </div>`;
  ligaExportar(); $("#volta").onclick=()=>ir("painel");
  $("#car").onclick=()=>{ const m=$("#msg"); try{ const j=JSON.parse($("#js").value); validar(j); lsSet(K_P,j); usarPacote(j); vDados.msg=`Pacote carregado: ${j.itens.length} itens.`; toast("Pacote carregado."); render(); }catch(e){ m.textContent=`Não carregou: ${e.message}. Confira o JSON e tente de novo.`; } };
  if($("#pub")) $("#pub").onclick=()=>{ lsDel(K_P); usarPacote(PUB); vDados.msg=`Pacote publicado ativo: ${PUB.itens.length} itens.`; toast("Pacote publicado ativo."); render(); };
  $("#apag").onclick=()=>{ const z=$("#zona"); z.innerHTML=`<div class="hl stack"><b>Apagar provas, caderno de erros, notas e rascunhos deste aparelho?</b><div class="row2"><button class="btn" id="n">Manter</button><button class="btn primary" id="s">Apagar</button></div></div>`; $("#n").onclick=render; $("#s").onclick=()=>{ S=novoEstado(); S.boasVindas=true; S.apresVista=true; S.concurso="cd26-c11"; S.discVista=true; garantirV15(); salvar(); toast("Progresso apagado."); render(); }; };
}
function usarPacote(j){ P=j; M=Object.fromEntries(P.itens.map(i=>[i.id,i])); construir(); }
/* v16: compara pacotes por geradoEm (AAAA-MM-DD…) e, empatado, pelo número de versão do nome ("(v1.12)") e por versao. */
function verNome(p){ const m=String((p&&p.nome)||"").match(/\bv(\d+(?:\.\d+)*)/i); return m?m[1].split(".").map(Number):[]; }
function cmpVer(a,b){ for(let i=0;i<Math.max(a.length,b.length);i++){ const d=(a[i]||0)-(b[i]||0); if(d) return d; } return 0; }
function pacoteMaisNovo(a,b){ const ga=String((a&&a.geradoEm)||""), gb=String((b&&b.geradoEm)||""); if(ga!==gb) return ga>gb;
  const c=cmpVer(verNome(a),verNome(b)); if(c) return c>0; return (+(a&&a.versao)||0)>(+(b&&b.versao)||0); }

const PUB_INLINE = __PACOTE__;

/* ============ Boot ============ */
(async function(){
  S=Object.assign(novoEstado(),lsGet(K_S)||{});
  if(!S.escolhaDisc){ S.escolhaDisc={}; DISCIPLINAS.forEach(d=>{ if(d.modulo && S.escolha[d.modulo]) S.escolhaDisc[d.id]=S.escolha[d.modulo]; }); if(Object.keys(S.escolhaDisc).length) salvar(); } // v14: escolha por disciplina, copiada das escolhas por módulo
  if(S.boasVindas && !S.concurso){ S.concurso="cd26-c11"; S.discVista=true; salvar(); } // usuária da v12: já está na Câmara e já escolheu
  try{ PUB=PUB_INLINE; validar(PUB); }
  catch(e){ PUB=null; }
  const loc=lsGet(K_P);
  if(loc){ try{ validar(loc);
      if(PUB && pacoteMaisNovo(PUB,loc)){ lsDel(K_P); ev("pacote_local_substituido",{de:`${loc.nome||"pacote"} · ${loc.geradoEm||"?"}`,para:`${PUB.nome||"pacote"} · ${PUB.geradoEm||"?"}`}); } // v16: o publicado mais novo prevalece; estado da aluna intacto
      else usarPacote(loc); }catch(e){ lsDel(K_P); P=null; } }
  if(!P && PUB) usarPacote(PUB);
  if(!P){ app().innerHTML=`${topo()}<div class="vazio">Não foi possível abrir o pacote de conteúdo. Recarregue a página; se continuar, cole um pacote.json abaixo.</div><textarea class="json" id="js" style="margin-top:12px"></textarea><button class="btn primary" id="car" style="margin-top:10px">Carregar</button><p id="msg" class="small muted"></p>`;
    $("#car").onclick=()=>{ try{ const j=JSON.parse($("#js").value); validar(j); lsSet(K_P,j); location.reload(); }catch(e){ $("#msg").textContent="Não carregou: "+e.message; } }; return; }
  garantirV15(); garantirV17();
  const h=(location.hash||"").slice(1); const ok=["painel","erros","recomendacoes","pratica","discursivas","vespera","dados"]; const alias={simulados:"pratica",estudo:"painel",resumo:"painel",disciplinas:"painel"};
  const hv=alias[h]||h;
  if(ok.includes(hv) && S.concurso && S.apresVista) ir(hv); else ir("inicio");
})();
</script>
